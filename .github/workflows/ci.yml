name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# CI1: cancel superseded runs on the same ref/PR so a fast push
# sequence doesn't queue 3× the jobs. The `ci` workflow_call in
# release.yml is keyed on the tag name (immutable), so release
# pipelines are never cancelled. release.yml deliberately omits
# concurrency — a tag build must run to completion once started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Unit tests
        run: go test -v -race -cover ./...

      - name: Integration tests
        run: go test -v -race -timeout 60s ./integration/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: backend

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

  e2e-protocol:
    name: E2E Protocol Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Build backend
        run: cd ../../backend && go build -o vote-server ./cmd/server

      - name: Start backend
        run: |
          cd ../../backend && ./vote-server &
          echo $! > /tmp/vote-server.pid
        env:
          PORT: "8080"
          VOTE_MAX_SESSIONS_PER_HOUR: "10000"

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not start"
          exit 1

      - run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run WS protocol tests
        run: npx playwright test ws-protocol.spec.ts
        env:
          SKIP_VITE: "1"

      - name: Stop backend
        if: always()
        run: kill $(cat /tmp/vote-server.pid) 2>/dev/null || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: vote:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify binary + healthcheck
        run: |
          set -euo pipefail
          docker run --rm -e PORT=0 vote:ci --help >/dev/null
          cid=$(docker run --rm -d -e PORT=8080 -p 8080:8080 vote:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:8080/livez" >/dev/null; then
              echo "livez: ok"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/livez never returned 200"
          docker logs "$cid" || true
          exit 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: govulncheck (backend)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          repo-checkout: false
          go-version-file: backend/go.mod
          work-dir: backend
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend, production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
