name: Release

on:
  push:
    tags:
      - "v*"

# D18: least-privilege default. Only the `release` job needs to mutate
# the repo (it creates the GitHub Release and uploads its assets); every
# other job reads source and writes either artifacts (covered by the
# implicit `actions: write` from the GITHUB_TOKEN) or package/attestation
# stores (granted explicitly at the job level). Keeping the workflow
# default to read-only means a compromised or buggy job in build-deb /
# docker can't push to tags, rewrite the release, or tamper with repo
# contents — the blast radius is bounded to its own artifact.
#
# OIDC (id-token: write) and SLSA provenance (buildx provenance + sbom)
# were added in D1 (cosign keyless signing, SPDX SBOM, buildx
# attestations). They are retained here unchanged.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-deb:
    # D14: matrix over amd64 + arm64. arm64 runs the entire
    # dpkg-buildpackage pipeline under QEMU (binfmt) so debian/rules is
    # reused unchanged and the resulting .deb is tagged with the correct
    # Architecture field automatically. The only arch-specific artifact
    # is the Go binary; the frontend build is identical across legs but
    # is cheap enough (~10s) that duplicating it costs less than the
    # complexity of a shared frontend-artifact leg + downstream merge.
    name: Build Debian Package (${{ matrix.deb_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            platform: linux/amd64
          - deb_arch: arm64
            platform: linux/arm64
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build metadata
        id: bmeta
        # Mirror the docker job: derive version info from git on the
        # runner (where git works) and inject into the deb-builder
        # container as VOTE_* env. Inside that container dpkg-buildpackage
        # runs as root against a runner-owned .git (safe.directory), so
        # debian/rules's own `git rev-parse` would fall back to "unknown"
        # and bake "unknown" into the footer + gitCommit ldflag.
        run: |
          if [ -n "$SOURCE_DATE_EPOCH" ]; then
            BT=$(TZ=UTC date -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")
          else
            BT=$(TZ=UTC date -d "@$(git show -s --format=%ct HEAD)" +"%Y-%m-%dT%H:%M:%SZ")
          fi
          echo "build_time=$BT" >> "$GITHUB_OUTPUT"
          echo "git_commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_full_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches changelog version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CHANGELOG_VERSION=$(head -1 debian/changelog | sed -n 's/.*(\([^)]*\)).*/\1/p')
          UPSTREAM="${CHANGELOG_VERSION%-*}"
          if [ -z "$CHANGELOG_VERSION" ]; then
            echo "::error::could not parse version from debian/changelog head"
            exit 1
          fi
          if [ "$TAG" != "$UPSTREAM" ]; then
            echo "::error::git tag '$TAG' != debian/changelog upstream '$UPSTREAM' (full: '$CHANGELOG_VERSION')"
            exit 1
          fi
          echo "OK: tag '$TAG' matches changelog '$CHANGELOG_VERSION'"

      # QEMU registers binfmt handlers so the arm64 container runs under
      # emulation. No-op for amd64 (the handler is already present on
      # ubuntu-latest, and buildx skips re-registration).
      - name: Set up QEMU
        if: matrix.deb_arch == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build the builder image for the target platform. --load imports
      # it into the local docker daemon so the next step can `docker run`
      # it. The GHA cache is keyed by platform so amd64 and arm64 layers
      # don't evict each other.
      - name: Build deb-builder image (${{ matrix.deb_arch }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.deb
          platforms: ${{ matrix.platform }}
          load: true
          tags: vote-deb-builder:latest
          cache-from: type=gha,ref=deb-builder-${{ matrix.deb_arch }}
          cache-to: type=gha,mode=max,ref=deb-builder-${{ matrix.deb_arch }}

      # dpkg-buildpackage writes the .deb to the parent of the source
      # tree. We mount the workspace at /work/vote so the parent /work
      # is inside the container's writable layer; the final cp moves the
      # artifact back into the mounted workspace so the upload step can
      # see it.
      - name: Build Debian package
        run: |
          set -euo pipefail
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "$PWD:/work/vote" -w /work/vote -e HOME=/tmp \
            -e "VOTE_BUILD_DATE=${{ steps.bmeta.outputs.build_time }}" \
            -e "VOTE_GIT_COMMIT=${{ steps.bmeta.outputs.git_commit }}" \
            -e "VOTE_GIT_FULL_COMMIT=${{ steps.bmeta.outputs.git_full_commit }}" \
            vote-deb-builder:latest \
            bash -c 'dpkg-buildpackage -us -uc -d -b && cp /work/vote_*.deb /work/vote/'
          # Verify the produced deb declares the expected arch.
          DEB=$(ls vote_*_${{ matrix.deb_arch }}.deb | head -1)
          if [ -z "$DEB" ]; then
            echo "::error::expected vote_*_${{ matrix.deb_arch }}.deb not found"
            ls -lh vote_*.deb || true
            exit 1
          fi
          echo "Built: $DEB"

      # D27: install smoke-test on the amd64 leg. The runner is a
      # real systemd-capable Ubuntu VM, so `apt install ./*.deb &&
      # systemctl start && curl /livez` is a ~10s gate that catches
      # packaging-path regressions (wrong install path, broken unit,
      # bad perms, missing runtime deps) that dpkg-buildpackage's
      # structural checks happily let through. The arm64 leg stays
      # build-only — the x86_64 runner can't exec the arm64 binary
      # without QEMU.
      - name: Install smoke-test (amd64)
        if: matrix.deb_arch == 'amd64'
        run: |
          set -euo pipefail
          DEB=$(ls vote_*_amd64.deb | head -1)
          sudo apt-get update -qq
          # Install and capture full output (postinst failures land here).
          sudo apt-get install -y ./"$DEB" || {
            echo "::error::apt install failed; dumping dpkg status"
            sudo dpkg --audit
            sudo dpkg -L vote || true
            exit 1
          }
          sudo systemctl start vote
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/livez >/dev/null; then
              echo "livez: ok"
              sudo systemctl stop vote
              exit 0
            fi
            sleep 1
          done
          echo "::error::installed vote service never returned /livez"
          sudo journalctl -u vote --no-pager | tail -50 || true
          sudo systemctl stop vote || true
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: debian-package-${{ matrix.deb_arch }}
          path: vote_*_${{ matrix.deb_arch }}.deb

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lowercase image repo
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build timestamp
        id: bmeta
        # D23: reproducible build. Derive BUILD_TIME from the committer
        # timestamp of HEAD (honouring SOURCE_DATE_EPOCH if set by the
        # caller) so two builds of the same tag produce byte-identical
        # images — and the cosign/SBOM/provenance supply-chain story
        # actually holds.
        run: |
          if [ -n "$SOURCE_DATE_EPOCH" ]; then
            BT=$(TZ=UTC date -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")
          else
            BT=$(TZ=UTC date -d "@$(git show -s --format=%ct HEAD)" +"%Y-%m-%dT%H:%M:%SZ")
          fi
          echo "build_time=$BT" >> "$GITHUB_OUTPUT"
          echo "git_commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_full_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ steps.bmeta.outputs.build_time }}
            GIT_COMMIT=${{ steps.bmeta.outputs.git_commit }}
            GIT_FULL_COMMIT=${{ steps.bmeta.outputs.git_full_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Keyless sign image
        env:
          IMAGE: ghcr.io/${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.spdx.json

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-deb, docker]
    # D18: the only job that needs to mutate repository contents — it
    # creates the GitHub Release and attaches the .deb + SBOM. Granted
    # explicitly here so the workflow-level `contents: read` default
    # stays tight for every other job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # D14: download both arch debs. download-artifact merges them into
      # ./ since each artifact contains exactly one vote_*_<arch>.deb.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: debian-package-*
          merge-multiple: true
          path: ./

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom
          path: ./

      - name: Verify expected artifacts present
        run: |
          set -euo pipefail
          for f in vote_*.deb sbom.spdx.json; do
            [ -e "$f" ] || { echo "::error::missing artifact: $f"; exit 1; }
            ls -lh "$f"
          done
          # Sanity: both arches should be present (D14).
          for arch in amd64 arm64; do
            if ! ls vote_*_$arch.deb >/dev/null 2>&1; then
              echo "::error::missing vote_*_$arch.deb — build-deb ($arch) may have failed"
              exit 1
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            vote_*.deb
            sbom.spdx.json
